<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>清明上河图 · 大宋汴京</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #d8ded9; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//  清明上河图 · 大宋汴京  ——  程序化微缩沙盘
// ============================================================

const GROUND = 0.12;        // 地形板顶面
const ROAD_Y = 0.145;       // 路面
const FIELD_Y = 0.135;      // 田垄
const WATER_Y = 0.035;      // 河面
const WORLD_LIMIT = 31;     // 元素活动边界

// ---------- 伪随机（固定种子，保证每次布局一致） ----------
let __seed = 20240404;
function rnd() {
  __seed = (__seed * 1664525 + 1013904223) >>> 0;
  return __seed / 4294967296;
}
function rr(a, b) { return a + (b - a) * rnd(); }
function ri(a, b) { return Math.floor(rr(a, b + 1)); }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }

// ---------- 渲染器 / 场景 / 相机 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdde3de, 96, 215);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 420);
camera.position.set(46, 42, 46);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.8;
controls.minDistance = 18;
controls.maxDistance = 130;
controls.maxPolarAngle = 1.45;
controls.minPolarAngle = 0.12;
controls.update();

// ---------- 光 ----------
const hemi = new THREE.HemisphereLight(0xdfeaf3, 0x8b7a5c, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe9c6, 2.05);
sun.position.set(34, 54, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -46;
sun.shadow.camera.right = 46;
sun.shadow.camera.top = 46;
sun.shadow.camera.bottom = -46;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.035;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);
scene.add(sun.target);

const fill = new THREE.DirectionalLight(0xbdd2df, 0.38);
fill.position.set(-34, 22, -30);
scene.add(fill);

// ---------- 天空背景 ----------
function makeSkyTexture() {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0.0, '#cfdbe2');
  grd.addColorStop(0.45, '#e2e7e2');
  grd.addColorStop(0.75, '#e9e5da');
  grd.addColorStop(1.0, '#d5d2c5');
  g.fillStyle = grd;
  g.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = makeSkyTexture();

// ============================================================
//  程序化贴图
// ============================================================
const CANVAS = {};
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  return c;
}
function C(key, w, h, draw) {
  if (!CANVAS[key]) CANVAS[key] = makeCanvas(w, h, draw);
  return CANVAS[key];
}
const TEX = new Map();
function texOf(key, w, h, draw, rx = 1, ry = 1) {
  const k = key + '|' + rx + '|' + ry;
  if (TEX.has(k)) return TEX.get(k);
  const t = new THREE.CanvasTexture(C(key, w, h, draw));
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = 8;
  TEX.set(k, t);
  return t;
}
function speckle(g, w, h, count, colors, alpha, size) {
  for (let i = 0; i < count; i++) {
    g.globalAlpha = alpha * (0.4 + rnd() * 0.8);
    g.fillStyle = colors[Math.floor(rnd() * colors.length)];
    const s = size * (0.4 + rnd());
    g.fillRect(rnd() * w, rnd() * h, s, s);
  }
  g.globalAlpha = 1;
}

// --- 青灰筒瓦 ---
function drawRoof(g, w, h) {
  g.fillStyle = '#3d464b'; g.fillRect(0, 0, w, h);
  const step = 16;
  for (let x = 0; x < w; x += step) {
    const grd = g.createLinearGradient(x, 0, x + step, 0);
    grd.addColorStop(0.00, '#232b30');
    grd.addColorStop(0.28, '#5f6a6f');
    grd.addColorStop(0.55, '#4d585d');
    grd.addColorStop(0.82, '#394349');
    grd.addColorStop(1.00, '#252e33');
    g.fillStyle = grd;
    g.fillRect(x, 0, step - 1, h);
    for (let y = 0; y < h; y += 22) {
      g.fillStyle = 'rgba(12,18,22,0.50)';
      g.fillRect(x, y, step - 1, 2);
      g.fillStyle = 'rgba(196,211,214,0.10)';
      g.fillRect(x, y + 2, step - 1, 1);
    }
    g.fillStyle = 'rgba(15,20,24,0.35)';
    g.fillRect(x + step - 2, 0, 1, h);
  }
  speckle(g, w, h, 260, ['#7d8a8d', '#22292d'], 0.11, 2);
}

// --- 青砖 / 城砖 ---
function drawBrick(g, w, h) {
  g.fillStyle = '#91897a'; g.fillRect(0, 0, w, h);
  const rowH = 18, bw = 36;
  const cols = ['#7d7768', '#857e6e', '#746e61', '#8b8375', '#6f6a5e'];
  for (let y = 0, r = 0; y < h; y += rowH, r++) {
    const off = (r % 2) * (bw / 2);
    for (let x = -bw; x < w + bw; x += bw) {
      g.fillStyle = cols[Math.floor(rnd() * cols.length)];
      g.fillRect(x + off + 1.5, y + 1.5, bw - 3, rowH - 3);
      g.fillStyle = 'rgba(255,255,255,0.045)';
      g.fillRect(x + off + 1.5, y + 1.5, bw - 3, 2);
    }
  }
  speckle(g, w, h, 420, ['#5b574c', '#a49b8a'], 0.16, 2);
}

// --- 深棕木板 ---
function drawWood(g, w, h) {
  g.fillStyle = '#6d4c30'; g.fillRect(0, 0, w, h);
  const pw = 26;
  for (let x = 0; x < w; x += pw) {
    g.fillStyle = `rgba(${ri(60, 105)},${ri(40, 72)},${ri(22, 44)},0.55)`;
    g.fillRect(x, 0, pw - 2, h);
    g.fillStyle = 'rgba(30,18,10,0.55)';
    g.fillRect(x + pw - 2, 0, 2, h);
    g.fillStyle = 'rgba(220,180,130,0.10)';
    g.fillRect(x + 1, 0, 1, h);
    for (let i = 0; i < 5; i++) {
      g.strokeStyle = `rgba(40,24,12,${0.10 + rnd() * 0.16})`;
      g.lineWidth = 0.8 + rnd();
      g.beginPath();
      const gx = x + 4 + rnd() * (pw - 10);
      g.moveTo(gx, 0);
      for (let y = 0; y <= h; y += 16) {
        g.lineTo(gx + Math.sin(y * 0.06 + i) * 1.6, y);
      }
      g.stroke();
    }
    if (rnd() < 0.5) {
      g.fillStyle = 'rgba(35,20,10,0.5)';
      g.beginPath();
      g.ellipse(x + pw * 0.5, rnd() * h, 2.2, 3.4, 0, 0, Math.PI * 2);
      g.fill();
    }
  }
  speckle(g, w, h, 300, ['#3a2414', '#b18a5e'], 0.10, 2);
}

// --- 米黄墙面 ---
function drawPlaster(g, w, h) {
  g.fillStyle = '#dccdaa'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    const x = rnd() * w, y = rnd() * h, r = 12 + rnd() * 46;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(${ri(190, 224)},${ri(175, 205)},${ri(140, 170)},0.28)`);
    grd.addColorStop(1, 'rgba(200,188,158,0)');
    g.fillStyle = grd;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 12; i++) {
    const x = rnd() * w;
    g.strokeStyle = 'rgba(120,105,80,0.13)';
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(x, rnd() * h);
    g.lineTo(x + rr(-6, 6), rnd() * h);
    g.stroke();
  }
  const grd2 = g.createLinearGradient(0, h * 0.65, 0, h);
  grd2.addColorStop(0, 'rgba(120,105,78,0)');
  grd2.addColorStop(1, 'rgba(110,96,70,0.28)');
  g.fillStyle = grd2;
  g.fillRect(0, 0, w, h);
  speckle(g, w, h, 240, ['#b8a888', '#efe3c6'], 0.13, 2);
}

// --- 灰褐石板路 ---
function drawStone(g, w, h) {
  g.fillStyle = '#6f6a5c'; g.fillRect(0, 0, w, h);
  const rowH = 26;
  const cols = ['#938d7c', '#87816f', '#9c9584', '#7c7767', '#8d8776'];
  for (let y = 0, r = 0; y < h; y += rowH, r++) {
    let x = -20 + (r % 2) * 14;
    while (x < w) {
      const bw = 26 + rnd() * 34;
      g.fillStyle = cols[Math.floor(rnd() * cols.length)];
      g.beginPath();
      g.roundRect ? g.roundRect(x + 1.5, y + 1.5, bw - 3, rowH - 3, 3) : g.rect(x + 1.5, y + 1.5, bw - 3, rowH - 3);
      g.fill();
      g.fillStyle = 'rgba(255,255,255,0.05)';
      g.fillRect(x + 2, y + 2, bw - 4, 2);
      x += bw;
    }
  }
  speckle(g, w, h, 500, ['#5a564a', '#b0a897'], 0.16, 2);
}

// --- 土路 ---
function drawDirt(g, w, h) {
  g.fillStyle = '#9c8867'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    g.fillStyle = `rgba(${ri(110, 170)},${ri(95, 145)},${ri(65, 110)},0.20)`;
    g.beginPath();
    g.ellipse(rnd() * w, rnd() * h, 6 + rnd() * 26, 4 + rnd() * 14, rnd() * 3, 0, Math.PI * 2);
    g.fill();
  }
  speckle(g, w, h, 600, ['#6d5c42', '#c0ab88', '#7e6c50'], 0.22, 2);
}

// --- 春草 ---
function drawGrass(g, w, h) {
  g.fillStyle = '#94a263'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 120; i++) {
    g.fillStyle = `rgba(${ri(95, 145)},${ri(120, 165)},${ri(70, 105)},0.30)`;
    g.beginPath();
    g.ellipse(rnd() * w, rnd() * h, 8 + rnd() * 30, 6 + rnd() * 20, rnd() * 3, 0, Math.PI * 2);
    g.fill();
  }
  for (let i = 0; i < 420; i++) {
    g.strokeStyle = rnd() < 0.5 ? 'rgba(80,105,52,0.45)' : 'rgba(170,186,120,0.45)';
    g.lineWidth = 1;
    const x = rnd() * w, y = rnd() * h;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + rr(-2, 2), y - rr(2, 6));
    g.stroke();
  }
}

// --- 田垄 ---
function drawField(g, w, h) {
  g.fillStyle = '#6f6a45'; g.fillRect(0, 0, w, h);
  const rowH = 26;
  for (let y = 0; y < h; y += rowH) {
    g.fillStyle = y % 2 === 0 ? 'rgba(96,92,58,0.85)' : 'rgba(122,116,74,0.75)';
    g.fillRect(0, y, w, rowH);
    g.fillStyle = 'rgba(44,42,26,0.5)';
    g.fillRect(0, y + rowH - 4, w, 4);
    for (let x = 4; x < w; x += 15) {
      g.fillStyle = `rgba(${ri(96, 128)},${ri(128, 158)},${ri(56, 78)},0.95)`;
      g.beginPath();
      g.ellipse(x + rr(-2, 2), y + rowH * 0.42, 3.2, 2.2, 0, 0, Math.PI * 2);
      g.fill();
    }
  }
  speckle(g, w, h, 300, ['#514a2e', '#9aa268'], 0.2, 2);
}

// --- 青绿水波 ---
function drawWater(g, w, h) {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#3d6062');
  grd.addColorStop(0.5, '#456b6b');
  grd.addColorStop(1, '#37585c');
  g.fillStyle = grd;
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) {
    const y = rnd() * h;
    const amp = 1 + rnd() * 3.2;
    const len = 20 + rnd() * 90;
    const x = rnd() * w;
    g.strokeStyle = rnd() < 0.62
      ? `rgba(150,183,180,${0.10 + rnd() * 0.22})`
      : `rgba(24,46,50,${0.10 + rnd() * 0.20})`;
    g.lineWidth = 0.8 + rnd() * 1.8;
    g.beginPath();
    for (let k = 0; k <= len; k += 4) {
      const yy = y + Math.sin((k / len) * Math.PI * 2) * amp;
      if (k === 0) g.moveTo(x + k, yy); else g.lineTo(x + k, yy);
    }
    g.stroke();
  }
  for (let i = 0; i < 90; i++) {
    g.fillStyle = `rgba(196,214,205,${0.06 + rnd() * 0.16})`;
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 8, 0.9);
  }
}

// --- 帆布 ---
function drawSail(g, w, h) {
  g.fillStyle = '#d7cbae'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 42) {
    g.fillStyle = 'rgba(120,104,74,0.28)';
    g.fillRect(x, 0, 2, h);
    g.fillStyle = 'rgba(255,250,232,0.20)';
    g.fillRect(x + 2, 0, 2, h);
  }
  for (let i = 0; i < 14; i++) {
    g.fillStyle = `rgba(${ri(140, 175)},${ri(120, 150)},${ri(85, 110)},0.20)`;
    g.beginPath();
    g.ellipse(rnd() * w, rnd() * h, 8 + rnd() * 26, 6 + rnd() * 22, rnd() * 3, 0, Math.PI * 2);
    g.fill();
  }
  g.strokeStyle = 'rgba(90,74,50,0.35)';
  g.lineWidth = 2;
  g.strokeRect(1, 1, w - 2, h - 2);
  speckle(g, w, h, 180, ['#b3a281', '#efe6cd'], 0.16, 2);
}

// --- 招牌（竖排汉字） ---
function signTexture(text, ink = '#2a2118', paper = '#e8dcc0') {
  const key = 'sign_' + text + ink + paper;
  const c = C(key, 128, 256, (g, w, h) => {
    g.fillStyle = paper;
    g.fillRect(0, 0, w, h);
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, 'rgba(120,100,70,0.16)');
    grd.addColorStop(0.5, 'rgba(255,255,255,0.05)');
    grd.addColorStop(1, 'rgba(100,82,56,0.24)');
    g.fillStyle = grd;
    g.fillRect(0, 0, w, h);
    g.strokeStyle = '#4a3a28';
    g.lineWidth = 10;
    g.strokeRect(5, 5, w - 10, h - 10);
    g.strokeStyle = 'rgba(255,250,230,0.35)';
    g.lineWidth = 2;
    g.strokeRect(12, 12, w - 24, h - 24);
    g.fillStyle = ink;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    const chars = Array.from(text);
    const n = chars.length;
    const size = n <= 1 ? 86 : n === 2 ? 74 : n === 3 ? 58 : 46;
    g.font = '900 ' + size + 'px "Noto Serif CJK SC", "Songti SC", "STSong", serif';
    for (let i = 0; i < n; i++) {
      const y = h * (i + 0.5) / n;
      g.fillText(chars[i], w / 2, y + 2);
    }
    speckle(g, w, h, 60, ['#6d5b42'], 0.10, 2);
  });
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

// --- 幌子（单字布招） ---
function bannerTexture(ch, bg = '#e4d9c0', fg = '#7a2a24') {
  const key = 'ban_' + ch + bg + fg;
  const c = C(key, 128, 192, (g, w, h) => {
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,0.10)';
    g.fillRect(0, 0, w, 10);
    g.fillRect(0, h - 12, w, 12);
    g.strokeStyle = 'rgba(60,40,25,0.45)';
    g.lineWidth = 4;
    g.strokeRect(2, 2, w - 4, h - 4);
    g.strokeStyle = 'rgba(255,255,255,0.22)';
    g.lineWidth = 1.5;
    g.strokeRect(9, 9, w - 18, h - 18);
    g.fillStyle = fg;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = '900 88px "Noto Serif CJK SC", "Songti SC", "STSong", serif';
    g.fillText(ch, w / 2, h / 2 + 4);
    speckle(g, w, h, 40, ['#8d7a58'], 0.10, 2);
  });
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

// ============================================================
//  材质
// ============================================================
function std(params) { return new THREE.MeshStandardMaterial(params); }

const M = {
  roof: std({ map: texOf('roof', 256, 256, drawRoof), roughness: 0.82, metalness: 0.04, color: 0xcfd6d6 }),
  roofDark: std({ color: 0x333b3f, roughness: 0.85 }),
  wood: std({ map: texOf('wood', 256, 256, drawWood, 2, 2), roughness: 0.88, color: 0xd8c8b2 }),
  woodDark: std({ color: 0x4b3427, roughness: 0.86 }),
  woodMid: std({ color: 0x77563a, roughness: 0.85 }),
  woodLight: std({ color: 0xa07d54, roughness: 0.86 }),
  brick: std({ map: texOf('brick', 256, 256, drawBrick, 2.4, 2.4), roughness: 0.95, color: 0xd8d4c8 }),
  brickWall: std({ map: texOf('brick', 256, 256, drawBrick, 9, 2.6), roughness: 0.96, color: 0xcac6b8 }),
  plaster: std({ map: texOf('plaster', 256, 256, drawPlaster, 1.4, 1.2), roughness: 0.95, color: 0xf0e8d2 }),
  stone: std({ map: texOf('stone', 256, 256, drawStone, 1.2, 1.2), roughness: 0.94, color: 0xd8d3c5 }),
  stoneFlat: std({ map: texOf('stone', 256, 256, drawStone, 1.0, 1.0), roughness: 0.95 }),
  stoneDark: std({ color: 0x6b6659, roughness: 0.95 }),
  earth: std({ map: texOf('dirt', 256, 256, drawDirt, 1.4, 1.4), roughness: 0.98, color: 0xe0d3bb }),
  grass: std({ map: texOf('grass', 256, 256, drawGrass, 1.2, 1.2), roughness: 0.98, color: 0xdfe4c4 }),
  field: std({ map: texOf('field', 256, 256, drawField, 1, 1), roughness: 0.98, color: 0xdfe0c0 }),
  water: std({
    map: texOf('water', 512, 512, drawWater, 1.1, 1),
    color: 0x9fc0b8, roughness: 0.24, metalness: 0.10
  }),
  riverbed: std({ color: 0x27332f, roughness: 1.0 }),
  sail: std({ map: texOf('sail', 256, 256, drawSail), roughness: 0.92, side: THREE.DoubleSide, color: 0xf2ecda }),
  clothCream: std({ color: 0xd9cbaa, roughness: 0.93, side: THREE.DoubleSide }),
  clothRed: std({ color: 0x8a382c, roughness: 0.9, side: THREE.DoubleSide }),
  clothBlue: std({ color: 0x43596a, roughness: 0.9, side: THREE.DoubleSide }),
  clothGreen: std({ color: 0x5c6b46, roughness: 0.9, side: THREE.DoubleSide }),
  clothBrown: std({ color: 0x6d5136, roughness: 0.93, side: THREE.DoubleSide }),
  darkOpening: std({ color: 0x241d17, roughness: 1.0 }),
  skin: std({ color: 0xc9a077, roughness: 0.9 }),
  black: std({ color: 0x241f1c, roughness: 0.9 }),
  metal: std({ color: 0x565049, roughness: 0.55, metalness: 0.65 }),
  gold: std({ color: 0x9c7c42, roughness: 0.6, metalness: 0.35 }),
  rope: std({ color: 0x8a7654, roughness: 1.0 }),
  green: std({ color: 0x6f8a4a, roughness: 0.95 }),
  greenDark: std({ color: 0x536b38, roughness: 0.95 }),
  greenLight: std({ color: 0x8fa45e, roughness: 0.95 }),
  trunk: std({ color: 0x5b4732, roughness: 1.0 }),

const GEO = new Map();
function gbox(w, h, d) {
  const k = 'b' + w.toFixed(2) + '_' + h.toFixed(2) + '_' + d.toFixed(2);
  if (!GEO.has(k)) GEO.set(k, new THREE.BoxGeometry(w, h, d));
  return GEO.get(k);
}
function gcyl(rt, rb, h, seg = 8) {
  const k = 'c' + rt.toFixed(2) + '_' + rb.toFixed(2) + '_' + h.toFixed(2) + '_' + seg;
  if (!GEO.has(k)) GEO.set(k, new THREE.CylinderGeometry(rt, rb, h, seg));
  return GEO.get(k);
}
function gsph(r, seg = 10) {
  const k = 's' + r.toFixed(2) + '_' + seg;
  if (!GEO.has(k)) GEO.set(k, new THREE.SphereGeometry(r, seg, Math.max(6, Math.floor(seg * 0.7))));
  return GEO.get(k);
}
function box(parent, w, h, d, mat, x = 0, y = 0, z = 0, cast = true, recv = true) {
  const m = new THREE.Mesh(gbox(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = recv;
  parent.add(m);
  return m;
}
function cyl(parent, rt, rb, h, mat, x = 0, y = 0, z = 0, seg = 8, cast = true) {
  const m = new THREE.Mesh(gcyl(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function sph(parent, r, mat, x = 0, y = 0, z = 0, seg = 10) {
  const m = new THREE.Mesh(gsph(r, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function plane(parent, w, h, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z);
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

//  组装时间轴
// ============================================================
const staged = [];
function stage(obj, t0, dur = 0.8, opts = {}) {
  const fpos = obj.position.clone();
  const fscale = obj.scale.clone();
  const frotY = obj.rotation.y;
  const s0 = opts.s0 === undefined ? 0.02 : opts.s0;
  const rise = opts.rise === undefined ? 1.6 : opts.rise;
  const spin = opts.spin === undefined ? 0.22 : opts.spin;
  obj.userData.st = { t0, dur, fpos, fscale, frotY, rise, spin, s0, bounce: !!opts.bounce, done: false };
  obj.scale.set(fscale.x * s0, fscale.y * s0, fscale.z * s0);
  obj.position.y = fpos.y - rise;
  obj.rotation.y = frotY - spin;
  staged.push(obj);
  return obj;
}
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeOutBack(x) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function updateStaging(t) {
  for (let i = 0; i < staged.length; i++) {
    const o = staged[i];
    const a = o.userData.st;
    if (!a || a.done) continue;
    const p = Math.min(1, Math.max(0, (t - a.t0) / a.dur));
    if (p >= 1) {
      o.scale.copy(a.fscale);
      o.position.copy(a.fpos);
      o.rotation.y = a.frotY;
      a.done = true;
      continue;
    }
    const e = a.bounce ? easeOutBack(p) : easeOutCubic(p);
    const s = a.s0 + (1 - a.s0) * e;
    o.scale.set(a.fscale.x * s, a.fscale.y * s, a.fscale.z * s);
    o.position.y = a.fpos.y - a.rise * (1 - e);
    o.rotation.y = a.frotY - a.spin * (1 - e);
  }
}

function ribbonMesh(points, width, y, mat, vScale = 7, uSpan = 1) {
  const n = points.length;
  const pos = [], uv = [], idx = [];
  let dist = 0;
  for (let i = 0; i < n; i++) {
    const p = points[i];
    const a = points[Math.max(0, i - 1)];
    const b = points[Math.min(n - 1, i + 1)];
    let tx = b.x - a.x, tz = b.z - a.z;
    const L = Math.hypot(tx, tz) || 1;
    tx /= L; tz /= L;
    const nx = -tz, nz = tx;
    if (i > 0) dist += Math.hypot(p.x - points[i - 1].x, p.z - points[i - 1].z);
    pos.push(p.x + nx * width * 0.5, y, p.z + nz * width * 0.5);
    pos.push(p.x - nx * width * 0.5, y, p.z - nz * width * 0.5);
    uv.push(0, dist / vScale);
    uv.push(uSpan, dist / vScale);
  }
  for (let i = 0; i < n - 1; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.receiveShadow = true;
  return m;
}

function makeRoof(w, d, h, type = 'gable', mat = M.roof) {
  const g = new THREE.Group();
  const W = w / 2, D = d / 2;
  const rh = type === 'hip' ? Math.max(0.12, W - D) : Math.max(0.12, W - 0.03);
  const pos = [], uv = [], idx = [];
  function V(p, u, vv) { pos.push(p[0], p[1], p[2]); uv.push(u, vv); return pos.length / 3 - 1; }
  function tri(a, b, c) { idx.push(a, b, c); }
  function quad(a, b, c, dd) { tri(a, b, c); tri(a, c, dd); }

  const A = V([-W, 0, D], 0, 0), B = V([W, 0, D], 1, 0);
  const R2 = V([rh, h, 0], 0.85, 1), R1 = V([-rh, h, 0], 0.15, 1);
  quad(A, B, R2, R1);

  const Cc = V([-W, 0, -D], 0, 0), Dd = V([W, 0, -D], 1, 0);
  const R2b = V([rh, h, 0], 0.85, 1), R1b = V([-rh, h, 0], 0.15, 1);
  quad(Dd, Cc, R1b, R2b);

  const A2 = V([-W, 0, D], 0.5, 0), D2 = V([-W, 0, -D], 0.5, 0), R1c = V([-rh, h, 0], 0.5, 1);
  tri(A2, R1c, D2);
  const B2 = V([W, 0, D], 0.5, 0), C2 = V([W, 0, -D], 0.5, 0), R2c = V([rh, h, 0], 0.5, 1);
  tri(B2, C2, R2c);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  g.add(mesh);

  // 檐口
  const fascia = M.woodDark;
  box(g, w + 0.06, 0.11, 0.13, fascia, 0, 0.01, D, true, true);
  box(g, w + 0.06, 0.11, 0.13, fascia, 0, 0.01, -D, true, true);
  box(g, 0.13, 0.11, d + 0.06, fascia, W, 0.01, 0, true, true);
  box(g, 0.13, 0.11, d + 0.06, fascia, -W, 0.01, 0, true, true);
  // 正脊
  box(g, rh * 2 + 0.34, 0.2, 0.26, M.roofDark, 0, h + 0.02, 0, true, true);
  if (rh > 0.2) {
    box(g, 0.3, 0.34, 0.34, M.roofDark, rh + 0.12, h + 0.08, 0, true, true);
    box(g, 0.3, 0.34, 0.34, M.roofDark, -rh - 0.12, h + 0.08, 0, true, true);
  }
  // 翘角
  const tips = [[W, D, 1, 1], [W, -D, 1, -1], [-W, D, -1, 1], [-W, -D, -1, -1]];
  for (const [tx, tz, sx, sz] of tips) {
    const tip = box(g, 0.5, 0.09, 0.16, M.roofDark, tx - sx * 0.08, 0.05, tz - sz * 0.05, true, true);
    tip.rotation.y = Math.atan2(sz, sx);
    tip.rotation.z = 0.30 * sx * sz * 0 + 0.22;
  }
  return g;
}

function gableEnd(d, h, thick, mat) {
  const s = new THREE.Shape();
  s.moveTo(-d / 2, 0);
  s.lineTo(d / 2, 0);
  s.lineTo(0, h);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false });
  geo.rotateY(Math.PI / 2);
  geo.translate(-thick / 2, 0, 0);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function makeSign(text, w = 0.78, h = 2.0) {
  const g = new THREE.Group();
  box(g, w + 0.12, h + 0.12, 0.09, M.woodDark, 0, 0, 0);
  const mat = std({ map: signTexture(text), roughness: 0.88 });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  p.position.z = 0.052;
  g.add(p);

function bridgeSlope(u) {

}

  box(t, 8.0, 0.18, 4.9, M.woodMid, 0, 0.36, 0);

  // 首层柱网
  const colH = 1.75;
  for (let i = -1; i <= 1; i++) {
    for (const sz of [-1, 1]) {

  // 首层背墙与侧墙

  box(t, 0.2, colH, 4.2, M.plaster, 3.55, 0.45 + colH / 2, 0);
  // 首层栏杆
  for (let i = -5; i <= 5; i++) {

  box(t, 7.8, 0.08, 0.1, M.redLacquer, 0, 1.05, 2.15);
  // 首层腰檐
  const eave1 = makeRoof(9.8, 6.4, 0.7, 'hip', M.roof);

  // 二层
  const upY = 2.55;
  box(t, 6.0, 0.16, 4.1, M.woodMid, 0, upY, 0);
  box(t, 5.4, 1.25, 3.5, M.plaster, 0, upY + 0.75, 0);
  for (const sx of [-1, 1]) {

      box(t, 0.14, 1.25, 0.14, M.redLacquer, sx * 2.6, upY + 0.75, sz * 1.68);

  for (let i = -1; i <= 1; i++) {
    box(t, 0.58, 0.7, 0.06, M.darkOpening, i * 1.55, upY + 0.78, 1.77, false, false);
    box(t, 0.06, 0.7, 0.07, M.woodDark, i * 1.55, upY + 0.78, 1.8);

  for (let i = -5; i <= 5; i++) {
    box(t, 0.07, 0.42, 0.07, M.redLacquer, i * 0.55, upY + 0.32, 1.82);
  }
  box(t, 6.1, 0.07, 0.09, M.redLacquer, 0, upY + 0.52, 1.82);

  // 二层歇山顶
  const roof2 = makeRoof(7.6, 5.3, 1.25, 'gable', M.roof);
  roof2.position.y = upY + 1.42;

  const geA = gableEnd(4.4, 1.15, 0.16, M.plaster);
  geA.position.set(3.55, upY + 1.42, 0);
  t.add(geA);
  const geB = gableEnd(4.4, 1.15, 0.16, M.plaster);
  geB.position.set(-3.55, upY + 1.42, 0);

  // 鸱吻
  for (const sx of [-1, 1]) {

    w.rotation.z = sx * 0.25;
  }
}

function hullGeometry(len, wid, depth) {
  const stations = 9;
  const pos = [], idx = [], uv = [];
  for (let i = 0; i <= stations; i++) {
    const u = i / stations;
    const x = -len / 2 + len * u;
    const taper = 0.34 + 0.66 * Math.pow(Math.sin(Math.PI * u), 0.5);
    const w = wid * 0.5 * taper;
    const dd = depth * (0.55 + 0.45 * Math.pow(Math.sin(Math.PI * u), 0.35));
    const sec = [[-w, 0], [-w * 0.93, -dd * 0.55], [0, -dd], [w * 0.93, -dd * 0.55], [w, 0]];
    for (let k = 0; k < sec.length; k++) {
      pos.push(x, sec[k][1], sec[k][0]);
      uv.push(u * 3, k / 4);
    }
  }
  for (let i = 0; i < stations; i++) {
    for (let k = 0; k < 4; k++) {
      const a = i * 5 + k, b = a + 1, c = (i + 1) * 5 + k, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const hullMat = std({ map: texOf('wood', 256, 256, drawWood, 3, 1), color: 0xa68d70, roughness: 0.85, side: THREE.DoubleSide });
const boatDeckMat = std({ map: texOf('wood', 256, 256, drawWood, 2, 1), color: 0xbfa583, roughness: 0.88 });
const cabinMat = std({ map: texOf('wood', 256, 256, drawWood, 1.5, 1), color: 0xcbb18c, roughness: 0.9 });
const sailMat = M.sail;

function ropeBetween(parent, a, b, r = 0.014, mat = M.rope) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 0.01) return null;
  const m = new THREE.Mesh(gcyl(r, r, len, 4), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  parent.add(m);
  return m;
}

function makeBoat(o = {}) {
  const len = o.len || 6.0;
  const wid = o.wid || 1.9;
  const depth = o.depth || 0.6;
  const g = new THREE.Group();
  const hull = new THREE.Mesh(hullGeometry(len, wid, depth), hullMat);
  hull.castShadow = true;
  hull.receiveShadow = true;
  g.add(hull);

  // 甲板
  {
    const pos = [], idx = [];
    for (let i = 0; i <= 8; i++) {
      const u = i / 8;
      const x = -len / 2 + len * u;
      const w = wid * 0.5 * (0.3 + 0.7 * Math.pow(Math.sin(Math.PI * u), 0.5)) * 0.94;
      pos.push(x, 0.02, -w, x, 0.02, w);
    }
    for (let i = 0; i < 8; i++) {
      const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
      idx.push(a, b, c, b, d, c);
    }
    const dg = new THREE.BufferGeometry();
    dg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    dg.setIndex(idx);
    dg.computeVertexNormals();
    const deck = new THREE.Mesh(dg, boatDeckMat);
    deck.receiveShadow = true;
    g.add(deck);
  }
  // 船舷压条
  for (const side of [-1, 1]) {
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const u = i / 10;
      const x = -len / 2 + len * u;
      const w = wid * 0.5 * (0.3 + 0.7 * Math.pow(Math.sin(Math.PI * u), 0.5));
      pts.push(new THREE.Vector3(x, 0.05, side * w));
    }
    const c = new THREE.CatmullRomCurve3(pts);
    const rim = new THREE.Mesh(new THREE.TubeGeometry(c, 18, 0.055, 4, false), M.woodDark);
    rim.castShadow = true;
    g.add(rim);
  }

  // 船楼 / 舱
  let cabinTop = 0.9;
  if (o.cabin !== false) {
    const cl = len * 0.3;
    const cx = o.cabinAt === 'bow' ? len * 0.2 : -len * 0.14;
    const ch = 0.92;
    const cw = wid * 0.62;
    const cabin = box(g, cl, ch, cw, cabinMat, cx, ch / 2 + 0.02, 0);
    // 舱顶
    box(g, cl + 0.18, 0.1, cw + 0.22, M.woodDark, cx, ch + 0.07, 0);
    // 舱窗
    for (let i = -1; i <= 1; i++) {
      box(g, 0.36, 0.3, 0.05, M.darkOpening, cx + i * cl * 0.28, ch * 0.62, cw / 2 + 0.008, false, false);
      box(g, 0.36, 0.3, 0.05, M.darkOpening, cx + i * cl * 0.28, ch * 0.62, -cw / 2 - 0.008, false, false);
    }
    cabinTop = ch + 0.12;
    // 舱壁画格
    for (let i = -2; i <= 2; i++) {
      box(g, 0.06, ch * 0.95, 0.05, M.woodMid, cx + i * cl * 0.2, ch * 0.5, cw / 2 + 0.02);
    }
  }

  // 桅杆组
  const mastGroup = new THREE.Group();
  const mastX = o.mastX === undefined ? len * 0.13 : o.mastX;
  mastGroup.position.set(mastX, 0.05, 0);
  g.add(mastGroup);
  const mastH = o.mastH || 5.2;
  const mast = new THREE.Mesh(gcyl(0.055, 0.085, mastH, 7), M.woodDark);
  mast.position.y = mastH / 2;
  mast.castShadow = true;
  mastGroup.add(mast);
  // 帆桁
  if (o.sail !== false) {
    const yard = new THREE.Mesh(gcyl(0.035, 0.035, len * 0.52, 5), M.woodDark);
    yard.rotation.z = Math.PI / 2;
    yard.position.y = mastH * 0.8;
    mastGroup.add(yard);
    const sail = new THREE.Mesh(new THREE.PlaneGeometry(len * 0.5, mastH * 0.36), sailMat);
    sail.position.set(0, mastH * 0.6, 0.03);
    sail.castShadow = true;
    sail.receiveShadow = true;
    mastGroup.add(sail);
    // 帆脚索
    ropeBetween(mastGroup, new THREE.Vector3(-len * 0.25, mastH * 0.42, 0.05), new THREE.Vector3(-len * 0.18, 0.1, 0.1), 0.012);
    ropeBetween(mastGroup, new THREE.Vector3(len * 0.25, mastH * 0.42, 0.05), new THREE.Vector3(len * 0.2, 0.1, 0.1), 0.012);
  }
  // 桅顶绳
  ropeBetween(g, new THREE.Vector3(mastX, mastH + 0.05, 0), new THREE.Vector3(len * 0.46, 0.1, 0), 0.012);
  ropeBetween(g, new THREE.Vector3(mastX, mastH + 0.05, 0), new THREE.Vector3(-len * 0.46, 0.1, 0), 0.012);
  // 桅顶小旗
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.22), M.clothRed);
  flag.position.set(mastX + 0.25, mastH + 0.02, 0);
  g.add(flag);

  // 货物
  if (o.cargo !== false) {
    const n = o.cargoCount || 3;
    for (let i = 0; i < n; i++) {
      if (i % 2 === 0) {
        box(g, rr(0.4, 0.6), rr(0.28, 0.42), rr(0.4, 0.55), M.woodLight, rr(-len * 0.36, -len * 0.18), 0.22, rr(-wid * 0.25, wid * 0.25));
      } else {
        const sack = new THREE.Mesh(gcyl(0.14, 0.18, 0.34, 7), M.straw);
        sack.position.set(rr(-len * 0.36, -len * 0.12), 0.2, rr(-wid * 0.25, wid * 0.25));
        sack.castShadow = true;
        g.add(sack);
      }
    }
  }

  // 船工
  const rowers = [];
  if (o.crew !== false) {
    const n = o.crewCount || 2;
    for (let i = 0; i < n; i++) {
      const p = makePerson(i === 0 ? 'boatman' : 'porter', { height: rr(1.0, 1.1) });
      p.position.set(len * (i === 0 ? 0.3 : -0.34), 0.04, i === 0 ? wid * 0.18 : -wid * 0.18);
      p.rotation.y = i === 0 ? Math.PI : 0;
      g.add(p);
      if (i === 0) {
        // 桨
        const oarPivot = new THREE.Group();
        oarPivot.position.set(p.position.x, 0.62, p.position.z + 0.25);
        const oar = new THREE.Mesh(gcyl(0.03, 0.045, 2.4, 5), M.woodMid);
        oar.rotation.z = 1.1;
        oar.position.set(-0.6, -0.5, 0.25);
        oarPivot.add(oar);
        oarPivot.userData.phase = rnd() * 6;
        g.add(oarPivot);
        rowers.push(oarPivot);
      }
    }
  }

  g.userData.mastGroup = mastGroup;
  g.userData.rowers = rowers;
  g.userData.len = len;
  g.userData.wid = wid;
  g.userData.cabinTop = cabinTop;
  return g;
}

const ROBE_MATS = [
  std({ color: 0x3f4a5c, roughness: 0.92 }),
  std({ color: 0x6b5136, roughness: 0.92 }),
  std({ color: 0x55606b, roughness: 0.92 }),

];
const WOMAN_MATS = [
  std({ color: 0x8a6f6a, roughness: 0.92 }),
  std({ color: 0x6f7a6a, roughness: 0.92 }),
  std({ color: 0x9a8468, roughness: 0.92 }),
  std({ color: 0x7d6b78, roughness: 0.92 })
];
const STRAW_MAT = std({ color: 0xb59a62, roughness: 1.0, side: THREE.DoubleSide });

function makePerson(role = 'vendor', o = {}) {
  const g = new THREE.Group();
  const H = o.height || rr(0.95, 1.18);
  const body = new THREE.Group();
  g.add(body);
  const woman = role === 'woman';
  const robe = role === 'official'
    ? M.redLacquer
    : woman ? pick(WOMAN_MATS) : pick(ROBE_MATS);
  const bodyH = woman ? 0.66 : 0.62;
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(woman ? 0.11 : 0.13, woman ? 0.24 : 0.27, bodyH, 7), robe);
  torso.position.y = 0.06 + bodyH / 2;
  torso.castShadow = true;
  torso.receiveShadow = true;
  body.add(torso);
  // 腰带
  const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.152, 0.168, 0.055, 7), M.woodDark);
  belt.position.y = 0.06 + bodyH * 0.56;
  body.add(belt);
  // 脖子
  const neck = new THREE.Mesh(gcyl(0.042, 0.05, 0.06, 6), M.skin);
  neck.position.y = 0.06 + bodyH + 0.02;
  body.add(neck);
  // 头
  const head = new THREE.Mesh(gsph(0.1, 8), M.skin);
  head.position.y = 0.06 + bodyH + 0.115;
  head.castShadow = true;
  body.add(head);

  // 帽 / 发
  if (woman) {
    const bun = new THREE.Mesh(gsph(0.075, 7), M.black);
    bun.position.set(0, 0.06 + bodyH + 0.19, -0.035);
    body.add(bun);
    const bun2 = new THREE.Mesh(gsph(0.05, 6), M.black);
    bun2.position.set(0, 0.06 + bodyH + 0.22, 0.02);
    body.add(bun2);
  } else if (role === 'official') {
    const hat = new THREE.Mesh(gbox(0.2, 0.1, 0.19), M.black);
    hat.position.y = 0.06 + bodyH + 0.22;
    body.add(hat);
    for (const sx of [-1, 1]) {
      const flap = new THREE.Mesh(gbox(0.16, 0.045, 0.06), M.black);
      flap.position.set(sx * 0.19, 0.06 + bodyH + 0.21, -0.01);
      flap.rotation.z = sx * 0.25;
      body.add(flap);
    }
  } else if (role === 'soldier') {
    const helm = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.16, 9), M.metal);
    helm.position.y = 0.06 + bodyH + 0.23;
    body.add(helm);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.03, 10), M.metal);
    brim.position.y = 0.06 + bodyH + 0.17;
    body.add(brim);
  } else if (role === 'scholar') {
    const cap = new THREE.Mesh(gbox(0.19, 0.13, 0.2), M.black);
    cap.position.y = 0.06 + bodyH + 0.2;
    body.add(cap);
  } else if (role !== 'woman') {
    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.235, 0.12, 9), STRAW_MAT);
    hat.position.y = 0.06 + bodyH + 0.2;
    hat.castShadow = true;
    body.add(hat);
  }

  // 双臂
  const armMat = role === 'official' ? M.redLacquer : robe;
  for (const sx of [-1, 1]) {
    const arm = new THREE.Mesh(gbox(0.062, 0.3, 0.062), armMat);
    arm.position.set(sx * 0.155, 0.06 + bodyH * 0.66, 0.025);
    arm.rotation.z = sx * 0.14;
    arm.rotation.x = -0.16;
    arm.castShadow = true;
    body.add(arm);
    const hand = new THREE.Mesh(gsph(0.038, 5), M.skin);
    hand.position.set(sx * 0.19, 0.06 + bodyH * 0.4, 0.08);
    body.add(hand);
  }

  // 挑担
  if (role === 'porter' && o.pole !== false) {
    const pole = new THREE.Mesh(gcyl(0.028, 0.032, 1.35, 5), M.woodMid);
    pole.rotation.z = Math.PI / 2;
    pole.position.set(0, 0.06 + bodyH * 0.94, 0.02);
    pole.castShadow = true;
    g.add(pole);
    for (const sx of [-1, 1]) {
      const b = new THREE.Mesh(gcyl(0.17, 0.13, 0.24, 8), M.straw);
      b.position.set(sx * 0.56, 0.06 + bodyH * 0.94 - 0.34, 0.02);
      b.castShadow = true;
      g.add(b);
      ropeBetween(g, new THREE.Vector3(sx * 0.56, 0.06 + bodyH * 0.94, 0.02), new THREE.Vector3(sx * 0.56, 0.06 + bodyH * 0.94 - 0.24, 0.02), 0.012);
    }
  }

  if (o.sit) {
    body.position.y = -0.07;
    body.scale.y = 0.78;
    body.scale.z = 1.05;
  }
  if (o.lean) {
    body.rotation.x = 0.34;
    body.position.z = 0.04;
  }
  if (woman && o.child) {
    g.scale.setScalar(0.68);
  } else {
    g.scale.setScalar(H);
  }
  g.userData.role = role;
  return g;
}

const HORSE_MAT = std({ color: 0x6a4e36, roughness: 0.94 });
const HORSE_DARK = std({ color: 0x46352a, roughness: 0.94 });
const OX_MAT = std({ color: 0x5c5148, roughness: 0.96 });

function makeAnimal(kind = 'horse') {
  const g = new THREE.Group();
  const isOx = kind === 'ox';
  const isDonkey = kind === 'donkey';
  const mat = isOx ? OX_MAT : isDonkey ? HORSE_DARK : HORSE_MAT;
  const k = isOx ? 1.0 : isDonkey ? 0.78 : 1.0;
  const bodyH = 0.5 * k;
  const body = box(g, 0.95 * k, 0.42 * k, 0.34 * k, mat, 0, bodyH + 0.28 * k, 0, true, true);
  // 颈
  const neck = box(g, 0.5 * k, 0.24 * k, 0.26 * k, mat, 0.42 * k, bodyH + 0.5 * k, 0);
  neck.rotation.z = 0.55;
  // 头
  const head = box(g, 0.34 * k, 0.2 * k, 0.22 * k, mat, 0.68 * k, bodyH + 0.62 * k, 0);
  head.rotation.z = 0.25;
  // 耳
  for (const sz of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.05 * k, 0.14 * k, 4), mat);
    ear.position.set(0.61 * k, bodyH + 0.75 * k, sz * 0.07 * k);
    g.add(ear);
  }
  // 腿
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const leg = new THREE.Mesh(gcyl(0.045 * k, 0.055 * k, 0.62 * k, 5), mat);
      leg.position.set(sx * 0.33 * k, 0.31 * k, sz * 0.11 * k);
      leg.castShadow = true;
      g.add(leg);
    }
  }
  // 尾
  const tail = new THREE.Mesh(gcyl(0.03 * k, 0.06 * k, 0.5 * k, 5), HORSE_DARK);
  tail.position.set(-0.5 * k, bodyH + 0.34 * k, 0);
  tail.rotation.z = -0.4;
  g.add(tail);
  // 鞍 / 货物
  if (isOx) {
    box(g, 0.6 * k, 0.12 * k, 0.5 * k, M.straw, -0.02, bodyH + 0.56 * k, 0);
  } else {
    box(g, 0.42 * k, 0.1 * k, 0.46 * k, M.clothRed, 0, bodyH + 0.56 * k, 0);
    if (kind === 'donkey') {
      box(g, 0.4 * k, 0.34 * k, 0.5 * k, M.woodLight, -0.15, bodyH + 0.78 * k, 0);
    }
  }
  return g;
}

function makeCart(kind = 'horse') {
  const g = new THREE.Group();
  // 车轮
  for (const sz of [-1, 1]) {
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.07, 6, 12), M.woodDark);
    wheel.position.set(-0.1, 0.44, sz * 0.62);
    wheel.rotation.y = Math.PI / 2;
    wheel.castShadow = true;
    g.add(wheel);
    for (let i = 0; i < 6; i++) {
      const spoke = new THREE.Mesh(gbox(0.05, 0.76, 0.05), M.woodMid);
      spoke.position.set(-0.1, 0.44, sz * 0.62);
      spoke.rotation.x = (Math.PI / 6) * i;
      g.add(spoke);
    }
  }
  // 车板
  box(g, 1.7, 0.16, 1.15, M.woodLight, 0.05, 0.62, 0);
  for (const sz of [-1, 1]) {
    box(g, 1.7, 0.42, 0.08, M.woodMid, 0.05, 0.9, sz * 0.55);
  }
  box(g, 0.08, 0.42, 1.15, M.woodMid, 0.9, 0.9, 0);
  // 车厢篷
  if (kind === 'canopy') {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 1.6, 10, 1, true, 0, Math.PI), M.clothCream);
    c.rotation.z = Math.PI / 2;
    c.position.set(0.05, 1.02, 0);
    c.castShadow = true;
    g.add(c);
  }
  // 辕
  for (const sz of [-1, 1]) {
    const shaft = new THREE.Mesh(gcyl(0.04, 0.05, 1.7, 5), M.woodDark);
    shaft.rotation.z = Math.PI / 2;
    shaft.position.set(1.65, 0.6, sz * 0.36);
    g.add(shaft);
  }
  return g;
}

function makeWheelbarrow() {
  const g = new THREE.Group();
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.05, 5, 10), M.woodDark);
  wheel.position.set(0.62, 0.26, 0);

const FOLIAGE_GEO = new THREE.IcosahedronGeometry(1, 1);

function makeTree(s = 1, variant = 0) {
  const g = new THREE.Group();

  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  g.add(trunk);

  const m1 = mats[variant % 3], m2 = mats[(variant + 1) % 3];
  foliage(g, 0.72 * s, m1, 0, trunkH + 0.42 * s, 0, 0.8);
  foliage(g, 0.52 * s, m2, 0.36 * s, trunkH + 0.18 * s, 0.18 * s, 0.85);
  foliage(g, 0.46 * s, m2, -0.34 * s, trunkH + 0.3 * s, -0.16 * s, 0.85);

function makeWillow(s = 1) {
  const g = new THREE.Group();
  const trunkH = 1.55 * s;
  const lower = new THREE.Mesh(gcyl(0.08 * s, 0.13 * s, trunkH * 0.72, 6), M.trunk);
  lower.position.set(0.04 * s, trunkH * 0.36, 0);
  lower.rotation.z = -0.09;
  lower.castShadow = true;
  g.add(lower);
  const upper = new THREE.Mesh(gcyl(0.05 * s, 0.08 * s, trunkH * 0.55, 5), M.trunk);
  upper.position.set(-0.06 * s, trunkH * 0.86, 0.02);
  upper.rotation.z = 0.16;
  upper.castShadow = true;
  g.add(upper);

  const crown = new THREE.Group();
  crown.position.set(-0.1 * s, trunkH + 0.25 * s, 0);
  g.add(crown);
  foliage(crown, 0.6 * s, M.greenLight, 0, 0, 0, 0.62);
  foliage(crown, 0.44 * s, M.green, 0.4 * s, -0.06 * s, 0.14 * s, 0.7);
  foliage(crown, 0.4 * s, M.green, -0.38 * s, 0.02 * s, -0.12 * s, 0.7);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + rnd() * 0.3;
    const rad = rr(0.3, 0.62) * s;
    const strand = new THREE.Mesh(gcyl(0.008, 0.03, rr(0.8, 1.25) * s, 4), M.greenLight);
    strand.position.set(Math.cos(a) * rad, -0.5 * s, Math.sin(a) * rad);
    strand.rotation.z = Math.cos(a) * 0.22;
    strand.rotation.x = -Math.sin(a) * 0.22;
    crown.add(strand);
  }
  g.userData.crown = crown;
  return g;
}

//  落位工具 & 占位避让
// ============================================================
const occupied = [];
function reserve(x, z, r) { occupied.push({ x, z, r }); }

function distToRiver(x, z) {
  let best = Infinity;
  for (let i = 0; i < riverPts.length; i++) {
    const p = riverPts[i];
    const d = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z);
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}
const roadSamples = [];
for (const arr of [mainPts, westPts, innerPts, farmPts]) {
  for (let i = 0; i < arr.length; i += 2) roadSamples.push(arr[i]);
}
function distToRoad(x, z) {
  let best = Infinity;
  for (let i = 0; i < roadSamples.length; i++) {
    const p = roadSamples[i];
    const d = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z);
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}
function freeAt(x, z, r) {
  if (Math.abs(x) > 30.4 || Math.abs(z) > 30.4) return false;
  if (distToRiver(x, z) < 4.9 + r) return false;
  if (distToRoad(x, z) < 2.4 + r) return false;
  for (let i = 0; i < occupied.length; i++) {
    const o = occupied[i];
    if (Math.hypot(o.x - x, o.z - z) < o.r + r) return false;
  }
  return true;
}

const shopExtras = [];
function placeShop(built, x, z, ry, t0, group = marketGroup) {
  const g = built.g;
  g.position.set(x, GROUND, z);
  g.rotation.y = ry;
  group.add(g);
  stage(g, t0, 0.92, { rise: 1.9, spin: 0.14, s0: 0.05 });
  reserve(x, z, 2.6);
  if (built.sign) shopExtras.push(built.sign);
  if (built.banner) {
    shopExtras.push(built.banner);
    swayBanners.push({ obj: built.banner, phase: rnd() * 6.283 });
  }
  return g;
}

function makeWalkerPath(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function sampleWalker(path, s) {
  s = Math.max(0, Math.min(path.len, s));
  let i = 1;
  while (i < path.cum.length - 1 && path.cum[i] < s) i++;
  const a = path.pts[i - 1];
  const b = path.pts[i];
  const seg = Math.max(1e-5, path.cum[i] - path.cum[i - 1]);
  const f = (s - path.cum[i - 1]) / seg;
  return {
    pos: a.clone().lerp(b, f),
    dir: b.clone().sub(a).normalize()
  };
}
function offsetPathPts(curve, lateral, y, samples = 26, t0 = 0, t1 = 1) {
  const out = [];
  for (let i = 0; i < samples; i++) {
    const t = t0 + (t1 - t0) * (i / (samples - 1));
    const p = curve.getPointAt(t);
    const tan = curve.getTangentAt(t);
    const n = new THREE.Vector3(-tan.z, 0, tan.x);
    out.push(new THREE.Vector3(p.x + n.x * lateral, y, p.z + n.z * lateral));
  }
  return out;
}

//  动态更新
// ============================================================
function updateWalkers(dt, time) {
  if (time < 28.2) return;
  for (const w of walkers) {
    w.s += w.dir * w.speed * dt;
    if (w.s > w.path.len - 0.4) { w.s = w.path.len - 0.4; w.dir = -1; }
    if (w.s < 0.4) { w.s = 0.4; w.dir = 1; }
    const sm = sampleWalker(w.path, w.s);
    w.holder.position.copy(sm.pos);
    w.holder.rotation.y = Math.atan2(sm.dir.x * w.dir, sm.dir.z * w.dir);
    if (w.person.userData.st && w.person.userData.st.done) {
      w.person.position.y = Math.abs(Math.sin(time * 6.5 + w.phase)) * 0.025;
      w.person.rotation.z = Math.sin(time * 6.5 + w.phase) * 0.025;
    }
  }
}

function updateHeroBoat(dt, time) {
  const t = 0.5 + 0.345 * Math.sin(time * 0.082);

  heroHolder.position.set(p.x, WATER_Y + 0.28, p.z);

  const d2 = (p.x - 2) * (p.x - 2) + p.z * p.z;
  const target = d2 < 92 ? 1.28 : 0.02;
  heroMastTilt += (target - heroMastTilt) * Math.min(1, dt * 1.6);

}

  for (const b of swayBanners) {
    b.obj.rotation.x = Math.sin(time * 1.45 + b.phase) * 0.10;
    b.obj.rotation.z = Math.sin(time * 0.85 + b.phase * 1.3) * 0.055;
  }
  for (const w of swayWillows) {
    const amp = w.amp || 1;
    w.obj.rotation.z = Math.sin(time * 1.1 + w.phase) * 0.04 * amp;
    w.obj.rotation.x = Math.cos(time * 0.8 + w.phase) * 0.032 * amp;
  }
  for (const o of rowers) {
    o.rotation.x = Math.sin(time * 1.8 + (o.userData.phase || 0)) * 0.17;
  }
}

// ============================================================
//  渲染循环
// ============================================================
const clock = new THREE.Clock();
let elapsed = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updateStaging(elapsed);
  updateWalkers(dt, elapsed);
  updateHeroBoat(dt, elapsed);
  updateSway(elapsed);

  // 河水沿长度缓慢流动
  if (waterMat.map) {
    waterMat.map.offset.y -= dt * 0.018;
    waterMat.map.offset.x = Math.sin(elapsed * 0.05) * 0.01;
  }
  // 桅顶小旗轻摆
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
});

// 首次展示：等组装完成后再允许平滑交互
renderer.domElement.addEventListener('pointerdown', () => { controls.enableDamping = true; });
</script>
